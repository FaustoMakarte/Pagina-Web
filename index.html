<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truco — Pagina-Web</title>
  <meta name="description" content="Bienvenida con login y juego de truco contra la máquina.">
  <meta name="theme-color" content="#0b1120">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1120;
      --accent: #6366f1;
      --accent-soft: rgba(99, 102, 241, 0.16);
      --card-bg: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #f59e0b;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef2f7;
        --card-bg: #ffffff;
        --border: rgba(15, 23, 42, 0.12);
        --text: #0f172a;
        --muted: #475569;
        --accent-soft: rgba(99, 102, 241, 0.12);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      padding: 1.5rem 1rem 2.5rem;
      display: flex;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(55rem 28rem at 50% -10%, rgba(99, 102, 241, 0.2), transparent 70%),
        var(--bg);
    }

    .shell { width: 100%; max-width: 40rem; }

    /* ---------- Login ---------- */

    .login {
      margin: 10vh auto 0;
      max-width: 26rem;
      padding: 2.5rem 2rem;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      margin-bottom: 1.1rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c7d2fe;
      background: var(--accent-soft);
      border-radius: 999px;
    }

    .dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: #22c55e; }

    .login h1 { font-size: clamp(1.5rem, 5vw, 1.9rem); letter-spacing: -0.03em; margin-bottom: 0.6rem; }
    .login > p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }

    form { margin-top: 1.6rem; text-align: left; display: grid; gap: 0.45rem; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-top: 0.5rem; }

    input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    form .btn { margin-top: 1rem; }
    .error { margin-top: 0.75rem; font-size: 0.85rem; color: #fca5a5; text-align: center; }

    /* ---------- Botones ---------- */

    .btn {
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.6rem 1.1rem;
      border-radius: 0.65rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.15s ease, background-color 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .btn.primary { width: 100%; color: #fff; background: var(--accent); }
    .btn.accent { color: #1c1917; background: var(--gold); }
    .btn.secondary { color: var(--text); background: transparent; border-color: var(--border); }
    .btn.ghost { color: var(--muted); background: transparent; }
    .btn.small { padding: 0.35rem 0.7rem; font-size: 0.78rem; }

    /* ---------- Tablero ---------- */

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
    }

    .score { display: flex; align-items: baseline; gap: 0.45rem; }
    .score.cpu { justify-content: flex-end; }
    .who { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .score strong { font-size: 1.5rem; font-variant-numeric: tabular-nums; }

    .mid { text-align: center; font-size: 0.72rem; color: var(--muted); }
    .hand-value { display: block; color: var(--gold); font-weight: 700; }

    .board {
      margin-top: 1rem;
      padding: 1.25rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
    }

    .hand { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; min-height: 5.7rem; }
    .row-label { display: block; text-align: center; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }

    .table {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      min-height: 7rem;
      margin: 0.75rem 0;
      border-top: 1px dashed var(--border);
      border-bottom: 1px dashed var(--border);
    }

    .empty { font-size: 0.8rem; color: var(--muted); }
    .slot { animation: drop 0.18s ease-out; }

    @keyframes drop {
      from { opacity: 0; transform: translateY(-6px) scale(0.96); }
      to { opacity: 1; transform: none; }
    }

    /* ---------- Cartas ---------- */

    .card {
      width: 4rem;
      height: 5.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      padding: 0;
      font: inherit;
      color: #0f172a;
      background: #f8fafc;
      border: 1px solid rgba(15, 23, 42, 0.18);
      border-radius: 0.6rem;
      box-shadow: 0 6px 14px -8px rgba(0, 0, 0, 0.6);
    }

    button.card { cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease; }
    button.card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px -10px rgba(0, 0, 0, 0.7); }
    button.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .card-num { font-size: 1.7rem; font-weight: 800; line-height: 1; color: var(--suit, #0f172a); }
    .card-suit { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--suit, #475569); }

    .suit-espada { --suit: #1d4ed8; }
    .suit-basto { --suit: #15803d; }
    .suit-oro { --suit: #b45309; }
    .suit-copa { --suit: #b91c1c; }

    .card.back {
      background: repeating-linear-gradient(45deg, #4338ca 0 6px, #4f46e5 6px 12px);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .status { text-align: center; font-size: 0.92rem; color: var(--muted); min-height: 1.4rem; }

    /* ---------- Acciones y registro ---------- */

    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin: 1rem 0; }
    .thinking { font-size: 0.85rem; color: var(--muted); }

    .log {
      list-style: none;
      max-height: 7.5rem;
      overflow-y: auto;
      padding: 0.75rem 0.9rem;
      font-size: 0.78rem;
      line-height: 1.55;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.12);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
    }

    .log li.call { color: #fbbf24; }
    .log li.answer { color: #93c5fd; }
    .log li.score { color: #86efac; font-weight: 600; }
    .log li.end { color: #f9a8d4; font-weight: 700; }

    @media (max-width: 420px) {
      .card { width: 3.4rem; height: 4.8rem; }
      .card-num { font-size: 1.4rem; }
      .topbar { padding: 0.7rem 0.75rem; gap: 0.4rem; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section id="login-view" class="login">
      <span class="badge"><span class="dot"></span>Acceso privado</span>
      <h1>Bienvenido a Pagina-Web</h1>
      <p>Ingresá con tu usuario para jugar al truco contra la máquina.</p>
      <form id="login-form" autocomplete="on">
        <label for="login-user">Usuario</label>
        <input id="login-user" name="usuario" autocomplete="username" required>
        <label for="login-pass">Contraseña</label>
        <input id="login-pass" name="clave" type="password" autocomplete="current-password" required>
        <button class="btn primary" type="submit">Entrar</button>
        <p id="login-error" class="error" role="alert" hidden>Usuario o contraseña incorrectos.</p>
      </form>
    </section>

    <section id="game-view" hidden>
      <header class="topbar">
        <div class="score">
          <span class="who">Vos</span>
          <strong id="score-player">0</strong>
        </div>
        <div class="mid">
          <span id="hand-value" class="hand-value"></span>
          <span class="target">a 15 puntos</span>
        </div>
        <div class="score cpu">
          <strong id="score-cpu">0</strong>
          <span class="who">Máquina</span>
        </div>
        <button id="logout" class="btn ghost small" type="button">Salir</button>
      </header>

      <div class="board">
        <span class="row-label">Máquina</span>
        <div id="cpu-hand" class="hand"></div>

        <div id="table" class="table"></div>

        <p id="status" class="status" role="status"></p>
        <div id="player-hand" class="hand"></div>
      </div>

      <div id="actions" class="actions"></div>
      <ol id="log" class="log" aria-live="polite"></ol>
    </section>
  </main>

  <script src="truco.js"></script>
  <script src="app.js"></script>
</body>
</html>
