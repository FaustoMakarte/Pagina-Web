<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenido a Pagina-Web</title>
  <meta name="description" content="Sitio de bienvenida de Pagina-Web, publicado con GitHub Pages.">
  <meta name="theme-color" content="#0b1120">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%8B%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1120;
      --accent: #6366f1;
      --card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --chip: rgba(99, 102, 241, 0.16);
      --chip-text: #c7d2fe;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: rgba(15, 23, 42, 0.1);
        --text: #0f172a;
        --muted: #475569;
        --chip: rgba(99, 102, 241, 0.12);
        --chip-text: #4338ca;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(55rem 28rem at 50% -10%, rgba(99, 102, 241, 0.2), transparent 70%),
        var(--bg);
    }

    main {
      width: 100%;
      max-width: 32rem;
      padding: 2.5rem 2rem;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.75rem;
      margin-bottom: 1.25rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--chip-text);
      background: var(--chip);
      border-radius: 999px;
    }

    .dot {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: #22c55e;
    }

    h1 {
      font-size: clamp(1.7rem, 5vw, 2.2rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 0.85rem;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1.9rem;
    }

    a {
      padding: 0.7rem 1.35rem;
      border-radius: 0.7rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease, background-color 0.15s ease;
    }

    .primary { color: #fff; background: var(--accent); }
    .primary:hover { filter: brightness(1.12); transform: translateY(-1px); }

    .secondary { color: var(--text); border: 1px solid var(--border); }
    .secondary:hover { background: var(--chip); transform: translateY(-1px); }

    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    footer {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <span class="badge"><span class="dot"></span>Sitio en línea</span>
    <h1>¡Bienvenido a Pagina-Web!</h1>
    <p>
      Nos alegra tenerte aquí. Esta página es HTML y CSS puros: sin frameworks,
      sin dependencias y sin recursos externos, publicada automáticamente con
      GitHub Actions en GitHub Pages.
    </p>
    <div class="actions">
      <a class="primary" href="https://github.com/FaustoMakarte/Pagina-Web">Ver el repositorio</a>
      <a class="secondary" href="https://github.com/FaustoMakarte/Pagina-Web/actions">Ver despliegues</a>
    </div>
    <footer>Hecho con HTML, CSS y GitHub Pages</footer>
  </main>
</body>
</html>
